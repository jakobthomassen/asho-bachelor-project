name: Scheduled Ping

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          URL: ${{ secrets.URL2 }}
        run: |
          curl -fsS -A "gh-actions-ping" "${URL%/}/health?source=github" > /dev/null

